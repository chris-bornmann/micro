ring_of_regeneration:
  category: ring
  name: ring of regeneration
  glyph: "="
  color: [120, 230, 120]   # green
  weight: 1
  slot: ring
  unidentified: {pool: ring, chance: 100}
  traits:
    # Its wearer heals twice as fast — faster, even, than attributes alone
    # ever allow.
    - {trait: regeneration, multiplier: 2}
  spawn: {model: fixed, count: 1}

amulet_of_wasting:
  category: amulet
  name: amulet of wasting
  glyph: "\""
  color: [140, 110, 160]   # tarnished violet
  weight: 1
  slot: neck
  unidentified: {pool: amulet, chance: 100}   # cursed: you may put it on unawares
  traits:
    # Once on, it won't come off; while it's on, its wearer doesn't heal,
    # and loses 1 HP every 25 turns.
    - {trait: cursed}
    - {trait: regeneration, multiplier: 0}
    - {trait: wasting, every: 25, amount: 1, type: poison, message: "The amulet saps your life."}
  spawn: {model: fixed, count: 1}

