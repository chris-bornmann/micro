# Items. See README.md for every field, trait and action.
#
# unidentified: {pool: ring, chance: 100} means an item may be seen only by
# its look ("an agate ring") until its type is identified: chance is the
# percent of games it starts unknown. The pools of looks are in
# appearances.yaml. Without it, an item is always known (a torch).
#
# spawn: {model: fixed, count: N} puts N of an item on every level. Items
# without a spawn block only appear some other way: carried by a monster,
# left by one, or placed by the game (stairs).

healing_potion:
  category: potion
  name: healing potion
  glyph: "!"
  color: [220, 20, 60]
  weight: 1
  use_verb: drink
  unidentified: {pool: potion, chance: 100}
  on_use:
    - {action: heal, amount: [8, 15]}
    - {action: cure, trait: poisoned, message: "The poison leaves your body."}
  traits:
    - {trait: fragile}
  spawn: {model: fixed, count: 1}

invisibility_potion:
  category: potion
  name: invisibility potion
  glyph: "!"
  color: [100, 20, 220]
  weight: 1
  use_verb: drink
  unidentified: {pool: potion, chance: 100}
  on_use:
    - {action: grant, trait: invisible, turns: [10, 30], describe: turn invisible, describe_they: vanishes from sight}
  traits:
    - {trait: fragile}
  spawn: {model: fixed, count: 1}

fine_dagger:
  category: weapon
  name: fine dagger
  glyph: ")"
  color: [180, 180, 210]
  weight: 3
  slot: weapon
  unidentified: {pool: dagger, chance: 60}   # 60% of games you won't know it on sight
  damage: {piercing: [1, 4]}
  traits:
    - {trait: enchant, amount: 1}
    - {trait: bonus_vs, kind: goblin, amount: 1}
  messages:
    hit:
      - "{The attacker} stabs you with {his} {weapon} for {damage} hp of damage!"
    miss:
      - "{The attacker} jabs at you with {his} {weapon}, but misses!"
    you_hit:
      - "You stab {the defender} with your {weapon} for {damage} hp of damage!"
      - "Your {weapon} slips between {the defender's} ribs for {damage} hp of damage."
    you_miss:
      - "{The defender} twists away from your {weapon}."
  spawn: {model: fixed, count: 1}

iron_gloves:
  category: weapon
  name: iron gloves
  glyph: ")"
  color: [150, 150, 160]   # iron gray
  weight: 4
  slot: weapon
  unidentified: {pool: gloves, chance: 60}
  # They cover the hands: no gauntlets or gloves while they're wielded.
  blocks: [hands]
  # Double a bare fist's 1-2 (player.yaml): if fists change, change this.
  damage: {bludgeoning: [2, 4]}
  messages:
    hit:
      - "{The attacker} pounds you with {his} {weapon} for {damage} hp of damage!"
      - "An iron fist from {the attacker} slams into you for {damage} hp of damage!"
    miss:
      - "{The attacker} swings an iron fist at you, but misses!"
    you_hit:
      - "You punch {the defender} with your {weapon} for {damage} hp of damage!"
      - "Your iron fist slams into {the defender} for {damage} hp of damage!"
    you_miss:
      - "Your iron fist swings wide of {the defender}."
  spawn: {model: fixed, count: 1}

poisoned_dagger:
  category: weapon
  name: poisoned dagger
  glyph: ")"
  color: [120, 200, 80]    # a sickly green edge
  weight: 3
  slot: weapon
  unidentified: {pool: dagger, chance: 60}
  damage: {piercing: [1, 4]}
  traits:
    # 4 a turn for 6 turns, less the victim's Stamina/5 (rounded up).
    - {trait: poisons, damage: 4, turns: 6}
  messages:
    hit:
      - "{The attacker} stabs you with {his} {weapon} for {damage} hp of damage!"
      - "{The attacker's} {weapon} nicks you for {damage} hp of damage."
    miss:
      - "{The attacker} jabs at you with {his} {weapon}, but misses!"
    you_hit:
      - "You stab {the defender} with your {weapon} for {damage} hp of damage!"
    you_miss:
      - "{The defender} twists away from your {weapon}."
  # No floor spawn: goblins carry these (see monsters.yaml).

rusty_sword:
  category: weapon
  name: rusty sword
  glyph: ")"
  color: [180, 180, 210]
  weight: 6
  slot: weapon
  unidentified: {pool: sword, chance: 60}   # cursed: you may wield it unawares
  damage: {slashing: [1, 6]}
  traits:
    # One less damage, and once wielded it cannot be let go.
    - {trait: cursed, damage: -1}
  messages:
    hit:
      - "{The attacker} strikes you with {his} {weapon} for {damage} hp of damage!"
      - "You are sliced by {the attacker's} {weapon} for {damage} hp of damage!"
    miss:
      - "{The attacker} swings {his} {weapon} at you, but misses!"
      - "{The attacker's} {weapon} whistles past your ear."
    you_hit:
      - "You hack at {the defender} with your {weapon} for {damage} hp of damage!"
      - "Your {weapon} bites into {the defender} for {damage} hp of damage."
    you_miss:
      - "Your {weapon} swings wide of {the defender}."

torch:
  category: torch
  name: torch
  glyph: /
  color: [210, 130, 40]
  weight: 2
  # Wielded, a club. Lit — in either hand — it lights the way; struck with
  # lit, its fire part becomes 1-2 and it sets what will burn alight.
  slot: weapon
  damage: {bludgeoning: [1, 2], fire: 0}
  on_use:
    # Lit where it is if wielded, else in the off hand, else the main hand;
    # both full, it can't be lit.
    - {action: light, turns: [6, 20]}
  spawn: {model: fixed, count: 1}

teleport_scroll:
  category: scroll
  name: scroll of teleportation
