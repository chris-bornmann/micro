summon_scroll:
  category: scroll
  name: scroll of summon monster
  glyph: "?"
  color: [220, 120, 200]
  weight: 1
  use_verb: read
  unidentified: {pool: scroll, chance: 100}
  on_use:
    # Asks for a monster's letter: an ordinary monster comes fresh; a
    # unique one (T, the Thief) comes from wherever he is.
    - {action: summon}
  spawn: {model: fixed, count: 1}

knowledge_scroll:
  category: scroll
  name: scroll of knowledge
  glyph: "?"
  color: [250, 250, 200]
  weight: 1
  use_verb: read
  unidentified: {pool: scroll, chance: 100}
  on_use:
    # Asks which of your other items to learn about, and reveals its true
    # name — and so every item of its kind. Reading it shows what the
    # scroll itself is, too.
    - {action: identify}
  spawn: {model: fixed, count: 1}

ring_of_true_sight:
  category: ring
  name: ring of true sight
  glyph: "="
  color: [230, 200, 60]    # gold
  weight: 1
  slot: ring               # either hand; at most two rings at once
  unidentified: {pool: ring, chance: 100}
  traits:
