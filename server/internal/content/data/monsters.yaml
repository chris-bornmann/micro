# Monsters. See README.md for every field, trait and AI behavior.

goblin:
  category: monster
  name: Goblin
  glyph: g
  color: [0, 200, 0]
  weight: 50
  level: 1
  hp: [5, 10]
  attributes: [2, 6]
  attack: {name: hands, damage: {bludgeoning: [1, 2]}}
  pronoun: he
  # Bare-handed. The rusty sword, when he has it, speaks for itself.
  messages:
    hit:
      - "{The attacker} claws at you for {damage} hp of damage!"
      - "{The attacker} punches you for {damage} hp of damage."
    miss:
      - "{The attacker} swipes at you, but misses!"
      - "You duck under {the attacker's} wild swing."
  ai: {behavior: chase_and_flee, flee_at_percent: 10}
  # Common, and native to the shallowest level: about 8 on level 1,
  # tapering off gently below.
  spawn: {model: common, density: 8, sigma_up: 6, sigma_down: 2, max_above: 4}
  # Equipment fills slots in order, skipping a slot already taken: the
  # first goblin on a level gets the cursed sword, the second the
  # poisoned dagger, and the rest fight bare-handed.
  equipment:
    - {item: rusty_sword, limit_per_level: 1}
    - {item: poisoned_dagger, limit_per_level: 2}
    - {item: helm, chance: 30}
    - {item: small_shield, chance: 25}

mummy:
  category: monster
  name: Mummy
  glyph: m
  color: [200, 190, 150]   # dusty bandage tan
  weight: 60
  level: 5
  hp: [20, 30]
  attributes: [4, 10]
  attack: {name: rotting touch, damage: {bludgeoning: [4, 10]}}
  messages:
    hit:
      - "{The attacker} grips you with a rotting hand for {damage} hp of damage!"
      - "{The attacker's} touch withers your flesh for {damage} hp of damage."
    miss:
      - "{The attacker} reaches for you, but you pull away!"
      - "{The attacker} lurches at you and misses."
  ai: {behavior: chase}
  # Rare: at most one per run, never above level 3, certainly by level 8.
  spawn: {model: single_shot, earliest: 3, force_by: 8, chance_scale: 0.6, sigma_up: 8, sigma_down: 2, max_above: 4}
  traits:
    # Wrapped in dry gauze: fire of any kind does double damage, and a
    # torch sets it burning.
    - {trait: vulnerable, type: fire, multiplier: 2}
    - {trait: flammable, turns: [2, 4]}
    # Undead: no blood for poison to work in.
    - {trait: resist, type: poison, multiplier: 0}
    # Undead: what is wrecked stays wrecked.
    - {trait: regeneration, multiplier: 0}

phantom:
  category: monster
  name: Phantom
  glyph: p
  color: [180, 190, 230]   # pale blue-white
  weight: 0
  level: 3
  hp: [6, 12]
  attributes: [3, 8]
  attack: {name: chilling touch, damage: {bludgeoning: [2, 5]}}
  messages:
    hit:
      - "{The attacker's} chilling touch drains the warmth from you for {damage} hp of damage."
      - "Something cold passes through you for {damage} hp of damage!"
    miss:
      - "An icy draft brushes past you."
      - "{The attacker} reaches for you, but its touch passes harmlessly by."
  ai: {behavior: chase}
  # Common but thin: about one per level at level 3, often none, sometimes
  # two or three; it fades out quickly above and below.
  spawn: {model: common, density: 1, sigma_up: 3, sigma_down: 1.5, max_above: 2}
  traits:
    # Unseen until badly hurt (below 4 HP), but glimpsed one turn in ten.
    - {trait: invisible, visible_below: 4, periodic_visible: 10}
    # Undead: no blood for poison to work in.
    - {trait: resist, type: poison, multiplier: 0}
    # Undead: what is wrecked stays wrecked.
    - {trait: regeneration, multiplier: 0}

vampire:
  category: monster
  name: Vampire
  glyph: v
  color: [160, 20, 40]     # dried-blood red
  weight: 120
  level: 8
  hp: [40, 100]
  attributes: [8, 14]
  attack: {name: fangs, damage: {piercing: [3, 8]}}
  pronoun: he
  # His bites say he feeds, so the drain itself stays quiet (below).
  messages:
    hit:
      - "{The attacker} sucks your blood for {damage} hp of damage, and seems energized by doing so!"
      - "{The attacker} sinks {his} fangs into your neck for {damage} hp of damage and grows stronger!"
    miss:
      - "{The attacker} lunges for your throat, but misses!"
      - "You twist away from {the attacker's} fangs."
  ai: {behavior: chase_and_flee, flee_at_percent: 25}
  # Rare and deep: at most one per run, not above level 6, certainly by 12.
  spawn: {model: single_shot, earliest: 6, force_by: 12, chance_scale: 0.6, sigma_up: 8, sigma_down: 2, max_above: 2}
  traits:
    # A fifth of every bite's damage flows back into it.
    - {trait: vampiric_attack, drain_percent: 20, message: ""}
    # It heals only by feeding.
    - {trait: regeneration, multiplier: 0}

slime:
  category: monster
  name: Slime
  glyph: s
  color: [90, 200, 90]
  weight: 30
  level: 2
  hp: [8, 14]
  attributes: [1, 4]
  attack: {name: engulf, damage: {bludgeoning: [1, 3]}}
  messages:
    hit:
      - "{The attacker} engulfs your arm for {damage} hp of damage!"
      - "{The attacker} oozes over your feet for {damage} hp of damage."
    miss:
      - "{The attacker} slurps toward you, but misses."
  ai: {behavior: chase}
  # Common on the first few levels, rare after.
  spawn: {model: common, density: 3, sigma_up: 3, sigma_down: 1.5, max_above: 1}
  traits:
    # Blades pass through it; a point does a little better; a blunt blow
    # splatters it; fire boils it.
    - {trait: resist, type: slashing, multiplier: 0.25}
    - {trait: resist, type: piercing, multiplier: 0.5}
    # It oozes back together three times as fast as anything else heals.
    - {trait: regeneration, multiplier: 3}
    - {trait: resist, type: poison, multiplier: 0}
    - {trait: vulnerable, type: bludgeoning, multiplier: 1.5}
    - {trait: vulnerable, type: fire, multiplier: 3}

# --- Unique characters -----------------------------------------------------
# Upper-case glyphs, at most one each in a run (spawn model single_shot), and
# a mind of their own: the utility AI weighs the options in their brain each
# turn. See README.md, "Unique characters".

thief:
  category: monster
  unique: true
  name: Thief
  glyph: T
  color: [200, 160, 255]
  pronoun: he
  weight: 80
  level: 3
  hp: [12, 20]
  attributes: [8, 14]
  attack: {name: fists, damage: {bludgeoning: [1, 3]}}
  attitude: neutral        # not out to hurt you; out to rob you
  equipment:
    - {item: fine_dagger}
    - {item: cloak_of_protection}
  inventory:
    - {item: healing_potion}
  ai: {behavior: utility}
  brain:
    # Attacked: usually fights back; caught running off with your things,
    # sometimes turns to defend himself. Never when badly hurt.
    - {option: retaliate, fight_chance: 75, afraid_fight_chance: 40}
    - {option: escape}                         # afraid and unseen: gone
    - {option: drink_to_heal, below_hp_percent: 40}
    - {option: steal, chance: 50}              # silently, from your pack
    - {option: flee, when_afraid: true, below_hp_percent: 25}
    - {option: attack}                         # only once hostile
    - {option: approach, until_adjacent: true} # sidles up to you
    - {option: wander}
  spawn: {model: single_shot, earliest: 2, force_by: 6, chance_scale: 0.6, sigma_up: 6, sigma_down: 2, max_above: 3}
  returns: {chance: 40}    # an escaped thief may turn up again deeper
  messages:
    hit:
      - "{The attacker} punches you for {damage} hp of damage!"
    miss:
      - "{The attacker} swings at you, but you sidestep."

# The throne room's own (data/levels/throne_room.yaml): placed there, and
# never met anywhere else.

royal_guard:
  category: monster
  name: Royal guard
  kind: guard
  glyph: w
  color: [200, 170, 60]
  pronoun: he
  weight: 90
  level: 8
  hp: [18, 26]
  attributes: [10, 15]
  attack: {name: fists, damage: {bludgeoning: [1, 3]}}
  equipment:
    - {item: rusty_sword}
    - {item: chain_mail}
    - {item: helm}
  ai: {behavior: chase}
  spawn: {model: placed}
  messages:
    hit:
      - "{The attacker} strikes you for {damage} hp of damage: \"For the King!\""

king:
  category: monster
  unique: true
  name: King
  glyph: K
  color: [255, 215, 0]
  pronoun: he
  weight: 100
  level: 12
  hp: [40, 50]
  attributes: [12, 18]
  attack: {name: scepter, damage: {bludgeoning: [2, 6]}}
  equipment:
    - {item: cloak_of_protection}
  inventory:
    - {item: healing_potion}
    - {item: healing_potion}
  ai: {behavior: utility}
  brain:
    - {option: drink_to_heal, below_hp_percent: 35}
    - {option: attack}
    - {option: approach}
  spawn: {model: placed}
  messages:
    hit:
      - "{The attacker} brings his scepter down on you for {damage} hp of damage!"
    miss:
      - "{The attacker} swings his scepter, and misses."
